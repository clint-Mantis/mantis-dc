# Builds the React app into ONE self-contained index.html and publishes it to the `gh-pages` branch
# (same hosting model as Mantis Hub). GitHub Pages serves that branch:
#   Settings › Pages › Source "Deploy from a branch" › Branch: gh-pages / (root) › Save
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install, test and build
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://lneidlowcjfxpunkwotm.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_dQHWSS-DcqgqxV0m-XuIwA_LGsuk5na' }}
      - name: Publish dist/ to the gh-pages branch
        run: |
          cd app/dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
